name: Build signed APK

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Keep tag builds so a release is never interrupted by a newer push.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  signed-apk:
    name: Signed release APK
    # Secrets are unavailable to pull requests from forks, so PRs use the check job below.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest already ships the Android SDK; setup-android@v3 tries to
      # install the obsolete `tools` package and fails before the build starts.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for dir in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools"/*/bin "$ANDROID_HOME/tools/bin"; do
            if [ -x "$dir/sdkmanager" ]; then SDKMANAGER="$dir/sdkmanager"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Placeholder secret names only — no credential values live in this file.
      # Configure these in Settings > Secrets and variables > Actions:
      #   ANDROID_KEYSTORE_BASE64    base64 of the release keystore file
      #   ANDROID_KEYSTORE_PASSWORD  keystore password
      #   ANDROID_KEY_ALIAS          key alias
      #   ANDROID_KEY_PASSWORD       key password
      # Create the first with: base64 release.keystore | tr -d '\n'
      - name: Validate signing secrets and decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_BASE64}" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${KEYSTORE_PASSWORD}" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "${KEY_ALIAS}" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "${KEY_PASSWORD}" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}" >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed APK
        env:
          SYNDICATE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SYNDICATE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SYNDICATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SYNDICATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build.sh

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          signer="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -1)"
          "${signer}" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-apk
          path: syndicate.apk
          if-no-files-found: error
          retention-days: 7

  pr-check:
    name: PR build and unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ubuntu-latest already ships the Android SDK; setup-android@v3 tries to
      # install the obsolete `tools` package and fails before the build starts.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for dir in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools"/*/bin "$ANDROID_HOME/tools/bin"; do
            if [ -x "$dir/sdkmanager" ]; then SDKMANAGER="$dir/sdkmanager"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew :app:assembleDebug testDebugUnitTest

      - name: Static checks
        run: ./gradlew detekt :app:lint

  release:
    name: Publish signed APK release
    if: startsWith(github.ref, 'refs/tags/')
    needs: signed-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: syndicate-apk
          path: artifacts

      - name: Publish release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/syndicate.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
