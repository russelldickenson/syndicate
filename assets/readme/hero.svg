<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="title desc">
  <title id="title">Syndicate — an offline-first RSS and Atom reader for Android</title>
  <desc id="desc">The Syndicate wordmark beside the app's RSS-wave and article-lines mark.</desc>

  <defs>
    <clipPath id="canvas">
      <rect width="1200" height="300" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="300" fill="#FFFBFF" />
    <rect x="720" y="0" width="480" height="300" fill="#F5F5FA" />
    <line x1="720" y1="0" x2="720" y2="300" stroke="#E1E2EC" stroke-width="2" />
  </g>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="600" letter-spacing="2" fill="#4655A4">ANDROID  ·  RSS + ATOM</text>
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="82" font-weight="700" fill="#1A1C23">Syndicate</text>
    <text x="0" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="25" fill="#44464F">An offline-first reader for the feeds you follow.</text>
    <text x="0" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="1" fill="#2C7A76">ADD FEEDS  →  ORGANIZE  →  READ</text>
  </g>

  <g id="project-mark" transform="translate(0 0)">
    <rect x="860" y="50" width="200" height="200" rx="46" fill="#4655A4" />
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
      <path d="M 920 193 A 42 42 0 0 1 962 235" />
      <path d="M 920 155 A 80 80 0 0 1 1000 235" />
      <path d="M 920 117 A 118 118 0 0 1 1038 235" />
    </g>
    <circle cx="920" cy="235" r="14" fill="#FFFFFF" />
    <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
      <path d="M 980 85 L 980 145" />
      <path d="M 994 93 L 1044 93" />
      <path d="M 994 117 L 1044 117" />
      <path d="M 994 141 L 1044 141" />
    </g>
  </g>
</svg>
